name: Lint
# Lint runs golangci-lint over the entire Atoshi repository This workflow is
# run on every pull request and push to main The `golangci` will pass without
# running if no *.{go, mod, sum} files have been changed.
on:
  pull_request:

permissions: read-all

jobs:
  golangci:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Required: setup-go, for all versions v3.0.0+ of golangci-lint
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - uses: actions/checkout@v4
      - uses: technote-space/get-diff-action@v6.1.2
        with:
          PATTERNS: |
            **/**.go
            go.mod
            go.sum
            *.toml
      - uses: golangci/golangci-lint-action@v6.2.0
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: latest
          args: --timeout 10m
          github-token: ${{ secrets.github_token }}
          # Report only what this PR introduces.
          #
          # The tree carries ~770 findings inherited from the Evmos fork,
          # almost all gofumpt formatting in files nobody here has touched.
          # Failing every PR on those teaches people to ignore the linter,
          # which is the opposite of what it is for -- and fixing them in a
          # release PR would bury the real diff under thousands of whitespace
          # lines, right when that diff is what an auditor is reading.
          #
          # New code is still held to the full ruleset: this branch went from
          # 109 new findings to 0 before the flag was added.
          only-new-issues: true
        # Check only if there are differences in the source code
        if: "env.GIT_DIFF"
