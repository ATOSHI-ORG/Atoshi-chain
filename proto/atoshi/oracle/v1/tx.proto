syntax = "proto3";
package atoshi.oracle.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "atoshi/oracle/v1/oracle.proto";
import "atoshi/oracle/v1/genesis.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/oracle/types";

// Msg defines the oracle Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // ReportPrice allows authorized feeders to submit price data.
  rpc ReportPrice(MsgReportPrice) returns (MsgReportPriceResponse);

  // UpdateParams updates the oracle module parameters via governance.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgReportPrice defines a message to submit a price report.
message MsgReportPrice {
  option (cosmos.msg.v1.signer) = "feeder";

  string feeder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  string volume_24h = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.customname) = "Volume24h",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // source identifies where this data came from
  string source = 4;
}

message MsgReportPriceResponse {}

// MsgUpdateParams defines a governance message to update oracle parameters.
message MsgUpdateParams {
  option (amino.name) = "atoshi/x/oracle/MsgUpdateParams";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}
