syntax = "proto3";
package atoshi.atox.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "atoshi/atox/v1/atox.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/atox/types";

// Query defines the atox module Query service.
service Query {
  // Params returns the module parameters: the supply cap, the transfer fee rate
  // and the automatic-settlement batch size.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/atoshi/atox/v1/params";
  }

  // GlobalState returns the chain-wide conversion accounting: the global index,
  // the live ATOX supply and the two burn totals (conversion and transfer fee),
  // which are tracked apart because only the fee burn frees minting headroom.
  rpc GlobalState(QueryGlobalStateRequest) returns (QueryGlobalStateResponse) {
    option (google.api.http).get = "/atoshi/atox/v1/global_state";
  }

  // Account returns the raw settlement record plus the amount that would be
  // credited by settling right now. Wallets should show
  // `pending + unsettled` as the user's convertible balance.
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http).get = "/atoshi/atox/v1/account/{address}";
  }

  // ExchangePool reports the module account holding the ATOS that backs ATOX,
  // so anyone can verify solvency without trusting the running totals.
  rpc ExchangePool(QueryExchangePoolRequest) returns (QueryExchangePoolResponse) {
    option (google.api.http).get = "/atoshi/atox/v1/exchange_pool";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryGlobalStateRequest {}
message QueryGlobalStateResponse {
  GlobalState state = 1 [(gogoproto.nullable) = false];

  // atox_supply is the live minted ATOX in aatox, always <= params.supply_cap.
  string atox_supply = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryAccountRequest {
  string address = 1;
}
message QueryAccountResponse {
  AtoxAccount account = 1 [(gogoproto.nullable) = false];

  // atox_balance is the account's live aatox balance.
  string atox_balance = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // unsettled is what settling now would add to pending:
  // atox_balance * (global_index - account.index).
  string unsettled = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // claimable is pending + unsettled — what MsgClaimAtos would pay right now.
  string claimable = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // can_claim is whether MsgClaimAtos would succeed right now. False alone is
  // ambiguous — see claim_blocked_reason for which of the several causes applies.
  bool can_claim = 5;

  // claim_blocked_reason explains a false can_claim in one machine-readable
  // token, so a wallet can show the right message instead of "nothing to claim"
  // for every cause:
  //
  //   ""                  can_claim is true
  //   "module_disabled"   params.enabled is false
  //   "module_account"    module accounts never accrue a conversion claim
  //   "nothing_to_claim"  the holder genuinely has no ATOX and no pending
  //   "pool_insufficient" the exchange pool cannot cover it yet — the claim is
  //                       owed and will succeed once a tier release funds it
  //
  // "pool_insufficient" is the one that must never be reported as
  // "nothing_to_claim": the holder IS owed, and telling them otherwise looks
  // like the chain lost their money.
  string claim_blocked_reason = 6;

  // burn_on_settle is the aatox that settling right now would destroy. It equals
  // `unsettled` by construction (one aatox per liao), and is surfaced separately
  // because wallets need it to size a transfer.
  string burn_on_settle = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // max_sendable is the largest ATOX transfer this account can sign right now:
  // atox_balance - burn_on_settle.
  //
  // Wallets must not offer `atox_balance` as "send max". A transfer settles the
  // sender first, which burns burn_on_settle aatox, so a send sized against the
  // displayed balance fails with insufficient funds for a reason the user cannot
  // see. The chain computes it here so every wallet gets the same answer.
  //
  // The transfer fee needs no headroom: it is INCLUSIVE, taken out of the amount
  // sent, so the recipient receives max_sendable minus the fee and the sender's
  // balance goes to zero.
  string max_sendable = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryExchangePoolRequest {}
message QueryExchangePoolResponse {
  // address of the atox_exchange_pool module account.
  string address = 1;

  // balance currently held by the pool, in liao.
  string balance = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // outstanding is total_pending: already settled and owed but not yet paid.
  // balance must always cover it.
  string outstanding = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
