syntax = "proto3";
package atoshi.tokenomics.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "atoshi/tokenomics/v1/tokenomics.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/tokenomics/types";

// GenesisState defines the tokenomics module's genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  ReleaseState release_state = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  BlockRewardState block_reward_state = 3 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  // 4 held miner_locked_balances, the per-validator lockup table. Block rewards
  // are ATOX and fully immediate now, so nothing feeds it.
  reserved 4;
  // project_claimable is the math.Int amount of project pool currently claimable.
  string project_claimable = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // migration_claimed lists the addresses that have already taken their
  // migration airdrop.
  //
  // This set is the only thing standing between the Merkle tree and the
  // migration pool: ClaimMigrationTokens checks it and nothing else records a
  // claim. Left out of genesis, an export/import -- disaster recovery, a hard
  // fork, a rebuild after an incident -- would let every address in the tree
  // claim a second time and empty the pool.
  repeated string migration_claimed = 6;
}
