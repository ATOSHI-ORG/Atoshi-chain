syntax = "proto3";
package atoshi.tokenomics.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/tokenomics/types";

// Params holds all governance-tunable parameters for the tokenomics module.
message Params {
  // miner_pool_total is the cap of the miner reward pool (10% of supply).
  string miner_pool_total = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // project_pool_total is the cap of the project treasury pool (89% of supply).
  string project_pool_total = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // migration_pool_total is the cap of the pre-mine migration pool (1% of supply).
  string migration_pool_total = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // 4 and 5 held immediate_reward_bps and locked_reward_bps, which split each
  // block reward into an immediate share and a per-validator lockup. Block
  // rewards are ATOX now and entirely immediate — ATOX's value is gated by the
  // conversion index rather than by a lockup — so the split has no meaning and
  // both are gone. Reserved so a future field cannot reuse the numbers and
  // misread an old value as something else.
  reserved 4, 5;

  // halving_interval_blocks is the number of blocks between block-reward halvings.
  int64 halving_interval_blocks = 6;

  // initial_block_reward is the per-block miner reward before any halvings.
  string initial_block_reward = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // price_base is the T0 USD price threshold (e.g. 0.15).
  string price_base = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // volume_base is the T0 24h USD volume threshold (e.g. 150000).
  string volume_base = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // tier_multiplier scales the price/volume threshold per tier (e.g. 1.1).
  string tier_multiplier = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // consecutive_days_required is the streak length needed to trigger a release.
  uint32 consecutive_days_required = 11;

  // release_percentage_bps is the share of circulating supply released per trigger.
  uint32 release_percentage_bps = 12;

  // miner_release_share_bps is the share of each release that comes from the miner pool.
  uint32 miner_release_share_bps = 13;

  // project_release_share_bps is the share that comes from the project pool.
  // miner + project share must equal 10000.
  uint32 project_release_share_bps = 14;

  // project_treasury_address is the bech32 address that receives project releases.
  // Mutable via gov MsgUpdateParams.
  string project_treasury_address = 15;

  // price_check_epoch_blocks is how often (in blocks) the EndBlocker evaluates the
  // price/volume streak. Defaults to ~24h.
  int64 price_check_epoch_blocks = 16;

  // migration_merkle_root is the hex-encoded Merkle root of the migration airdrop.
  string migration_merkle_root = 17;

  // migration_claim_end_time_unix is the unix-time deadline after which migration
  // claims are rejected.
  int64 migration_claim_end_time_unix = 18;
}

// ReleaseState tracks the global price-unlock state machine.
message ReleaseState {
  uint32 current_tier = 1;
  uint32 consecutive_days = 2;
  int64 last_check_block = 3;
  int64 last_check_time_unix = 4;
  string total_miner_released = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string total_project_released = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // 7 and 8 held total_immediate_distributed and total_miner_locked. Both
  // belonged to the ATOS block-reward model: nothing writes either any more, so
  // both would read zero forever, and a permanently-zero term in the circulating
  // supply formula is dead weight that has to be explained to every reader.
  reserved 7, 8;
}

// BlockRewardState tracks how much of the miner pool has already been distributed.
message BlockRewardState {
  string total_distributed = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 current_period = 2;
}
