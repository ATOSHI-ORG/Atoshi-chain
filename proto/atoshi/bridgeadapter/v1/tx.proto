syntax = "proto3";
package atoshi.bridgeadapter.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "atoshi/bridgeadapter/v1/bridgeadapter.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/bridgeadapter/types";

// Msg defines the bridge adapter Msg service.
//
// There is deliberately no message for applying a release. Releases arrive only
// as Hyperlane receipts verified by the ISM; exposing a privileged "apply"
// transaction would create a way to release ATOS without any ERC20 behind it,
// which is the single thing this module exists to prevent.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // BridgeOut locks ATOS and requests the matching ERC20 on Ethereum.
  rpc BridgeOut(MsgBridgeOut) returns (MsgBridgeOutResponse);

  // UpdateParams sets the module parameters. Governance only -- it carries the
  // bridge kill switch, the rate limits and the Ethereum-side addresses.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // EmergencyHalt closes the bridge immediately, from a guardian key rather
  // than a governance vote. It can only close; reopening stays with governance.
  rpc EmergencyHalt(MsgEmergencyHalt) returns (MsgEmergencyHaltResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateParamsResponse {}

// MsgEmergencyHalt switches enabled and bridge_enabled off in one transaction,
// signed by an address listed in params.guardians.
//
// It exists because governance is too slow for this. On 2026-10-26 the
// Ethereum side was paused within minutes through EmergencyGuard while this
// side waited three hours for a proposal to pass, and the difference shows in
// the ledger: every ERC20 the attacker took left the vault before that pause,
// and nothing left after it.
//
// Deliberately one-way. There is no MsgEmergencyResume: turning the bridge
// back on goes through UpdateParams, which is governance. A guardian key that
// leaks can therefore cost availability, which a proposal can restore, but not
// funds, which it cannot. That trade is the reason this message is safe to
// hand to a hot key.
//
// Halting an already-halted bridge succeeds. An operator who is unsure should
// send it, not check first.
message MsgEmergencyHalt {
  option (cosmos.msg.v1.signer) = "guardian";

  string guardian = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // reason is recorded in the event so the incident log says why, in the
  // operator's words, without needing a second system.
  string reason = 2;
}

message MsgEmergencyHaltResponse {}

// MsgBridgeOut locks ATOS and dispatches a Hyperlane message so the matching
// ERC20 is released on Ethereum.
//
// The ATOS moves into the migration pool rather than being burned: neither ATOS
// nor the ERC20 can be minted, so the bridge is lock-and-unlock on both sides
// and the pool IS the counterparty for inbound transfers.
message MsgBridgeOut {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // recipient is the 32-byte Hyperlane-encoded Ethereum address to credit.
  bytes recipient = 2;

  // amount of ATOS to bridge out. It must be an exact multiple of the peg, since
  // a remainder could not be represented in the ERC20 amount and would be
  // silently confiscated.
  string amount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // max_fee bounds what the interchain gas payment may cost the sender.
  repeated cosmos.base.v1beta1.Coin max_fee = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

message MsgBridgeOutResponse {
  // message_id is the Hyperlane message id, for tracking delivery.
  bytes message_id = 1;

  // erc20_amount actually requested on Ethereum, in ERC20 units.
  string erc20_amount = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
