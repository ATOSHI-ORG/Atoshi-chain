syntax = "proto3";
package atoshi.bridgeadapter.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "atoshi/bridgeadapter/v1/bridgeadapter.proto";

option go_package = "github.com/atoshi-chain/atoshi/v20/x/bridgeadapter/types";

// Query defines the bridgeadapter module Query service.
service Query {
  // Params returns the module parameters: the kill switch, the Ethereum-side
  // addresses and every rate-limit figure.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/atoshi/bridgeadapter/v1/params";
  }

  // ReceiptState is what an auditor compares against the Ethereum vault: the
  // cumulative ERC20 confirmed here must equal what the vault reports having
  // released.
  // Limits reports the caps in force right now plus how much of each is left,
  // for both directions.
  //
  // Without it a client can read the params but not the usage, so the only
  // number it can show is the ceiling -- which looks identical whether the day
  // is untouched or nearly exhausted. That is the single most common reason a
  // rate limit is reported as "not working".
  rpc Limits(QueryLimitsRequest) returns (QueryLimitsResponse) {
    option (google.api.http).get = "/atoshi/bridgeadapter/v1/limits";
  }

  // RateLimitState is the raw daily counters, unresolved against the caps.
  rpc RateLimitState(QueryRateLimitStateRequest) returns (QueryRateLimitStateResponse) {
    option (google.api.http).get = "/atoshi/bridgeadapter/v1/rate_limit_state";
  }

  // AddressUsage is one address's outbound usage today, for showing a per-user
  // remaining allowance.
  rpc AddressUsage(QueryAddressUsageRequest) returns (QueryAddressUsageResponse) {
    option (google.api.http).get = "/atoshi/bridgeadapter/v1/address_usage/{address}";
  }

  // ReceiptState returns the cumulative totals Ethereum has confirmed, plus the
  // app ids both message channels are addressed to.
  rpc ReceiptState(QueryReceiptStateRequest) returns (QueryReceiptStateResponse) {
    option (google.api.http).get = "/atoshi/bridgeadapter/v1/receipt_state";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryReceiptStateRequest {}
message QueryReceiptStateResponse {
  ReceiptState state = 1 [(gogoproto.nullable) = false];

  // pending_bridge is what tier judgments have authorised but Ethereum has not
  // yet confirmed, in ERC20 units. A figure that stays positive means receipts
  // are not arriving and the ATOX conversion rate has stopped advancing.
  string pending_bridge = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // pending_project is the same figure for the project share.
  string pending_project = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryLimitsRequest {}
message QueryLimitsResponse {
  // outbound_* are the resolved outbound caps and what is left of them today.
  string outbound_global_cap = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string outbound_global_remaining = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string outbound_large_budget = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string outbound_large_remaining = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string per_address_cap = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string small_transfer_threshold = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string min_transfer_out = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  bool crisis_mode = 8;

  // inbound_* mirror the outbound pair for the bridge-in direction.
  string inbound_cap = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string inbound_remaining = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // resets_at_unix is when today's counters roll over (UTC midnight).
  //
  // The rate-limit day is a real 24 hours even on a test network, where
  // tokenomics compresses its own day to minutes -- the two are unrelated
  // clocks, and a client that assumes otherwise will show a reset that never
  // comes.
  int64 resets_at_unix = 11;

  // migration_pool_balance is what the bps legs are computed against, returned
  // so a client can reproduce the caps rather than trust them.
  string migration_pool_balance = 12 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // rate_limits_disabled mirrors the param. When true every figure above is
  // still reported -- they are what the limits WOULD be -- but nothing is
  // enforced. A UI that shows a quota bar must check this first, or it will
  // tell users they are near a cap that is not being applied.
  bool rate_limits_disabled = 13;
}

message QueryRateLimitStateRequest {}
message QueryRateLimitStateResponse {
  RateLimitState state = 1 [(gogoproto.nullable) = false];
}

message QueryAddressUsageRequest {
  string address = 1;
}
message QueryAddressUsageResponse {
  // used today by this address, outbound.
  string used = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // remaining is per_address_cap - used, floored at zero.
  string remaining = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
